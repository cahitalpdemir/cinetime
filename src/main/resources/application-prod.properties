app.security.enabled=true

# Production must be configured explicitly by environment variables.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
jwt.secret=${JWT_SECRET}
ticket.qr.secret=${TICKET_QR_SECRET}
app.admin.email=${ADMIN_EMAIL}
app.admin.password=${ADMIN_PASSWORD}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.mail.frontend-url=${FRONTEND_URL}

# Keep generated logs on stdout/stderr for container platforms.
logging.file.name=

# Swagger is disabled by default in production. Enable only for staging/demo.
springdoc.swagger-ui.enabled=${SWAGGER_UI_ENABLED:false}
springdoc.api-docs.enabled=${API_DOCS_ENABLED:false}

# Health endpoint for deployment platforms.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.redis.enabled=${REDIS_HEALTH_ENABLED:false}
