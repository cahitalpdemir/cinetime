spring.application.name=cinetime

server.port=${PORT:${SERVER_PORT:8081}}

server.error.include-binding-errors=always
server.error.include-message=always
server.error.include-stacktrace=never

# PostgreSQL Database Connection
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cinetime_db}
spring.datasource.username=${DB_USERNAME:db_user}
spring.datasource.password=${DB_PASSWORD:password}

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Flyway owns all schema changes. Existing pre-Flyway databases are baselined at V1.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=${SWAGGER_UI_ENABLED:true}
springdoc.api-docs.enabled=${API_DOCS_ENABLED:true}

#logging
logging.file.name=log/cinetime.log
logging.pattern.file=%d %-5level [%thread] %logger:%msg%n
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=INFO
logging.level.com.tpe.cinetime=INFO

#JWT
jwt.secret=${JWT_SECRET:test-secret-key-test-secret-key-test-secret-key-test-secret-key}
cinetime.app.accessTokenExpirationMs=900000
cinetime.app.refreshTokenExpirationMs=604800000

#Redis-Upstash
spring.redis.url=${REDIS_URL:}
spring.data.redis.repositories.enabled=false
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.ssl=${REDIS_SSL:false}
spring.redis.lettuce.pool.max-active=10
spring.redis.lettuce.pool.max-idle=5
spring.redis.lettuce.pool.min-idle=1
app.refresh-token.store=${REFRESH_TOKEN_STORE:redis}

#admin credentials
app.admin.email=${ADMIN_EMAIL:admin@cinetime.com}
app.admin.password=${ADMIN_PASSWORD:cine1234}

#Mailpit SMTP
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS_ENABLE:false}

#Reset token expiration time(in minutes)
app.reset.token.expiration.time=15

#Mail Properties (MailProperties.java)
app.mail.from=${MAIL_FROM:no-reply@cinetime.local}
app.mail.frontend-url=${FRONTEND_URL:http://localhost:3000}
app.mail.reset-path=/reset-password
app.mail.token-validity-minutes=15

# Browser clients allowed to call the API. Use a comma-separated list for multiple origins.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Confirmed bookings can be cancelled and refunded until this many minutes before showtime.
app.booking.cancellation-cutoff-minutes=${BOOKING_CANCELLATION_CUTOFF_MINUTES:120}

# Dedicated signing secret for ticket QR payloads. Use at least 32 characters.
ticket.qr.secret=${TICKET_QR_SECRET:test-ticket-qr-secret-test-ticket-qr-secret}


#Profile
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}
