spring.application.name=cinetime

server.port=${SERVER_PORT:8081}

server.error.include-binding-errors=always
server.error.include-message=always
server.error.include-stacktrace=never

# PostgreSQL Database Connection
spring.datasource.url=jdbc:postgresql://localhost:5432/cinetime_db
spring.datasource.username=${DB_USERNAME:db_user}
spring.datasource.password=${DB_PASSWORD:password}

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true

#logging
logging.file.name= log/cinetime.log
logging.pattern.file= "%d %-5level [%thread] %logger:%msg%n"
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=INFO
logging.level.com.tpe.cinetime=INFO

#JWT
jwt.secret=${JWT_SECRET:test-secret-key-test-secret-key-test-secret-key-test-secret-key}
cinetime.app.accessTokenExpirationMs=900000
cinetime.app.refreshTokenExpirationMs=604800000

#Redis-Upstash
spring.redis.host=${REDIS_HOST}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD}
spring.redis.ssl=true
spring.redis.lettuce.pool.max-active=10
spring.redis.lettuce.pool.max-idle=5
spring.redis.lettuce.pool.min-idle=1

#admin credentials
app.admin.email=${ADMIN_EMAIL:admin@cinetime.com}
app.admin.password=${ADMIN_PASSWORD:cine1234}

#Mailpit SMTP
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

#Reset token expiration time(in minutes)
app.reset.token.expiration.time=15

#Mail Properties (MailProperties.java)
app.mail.from=${MAIL_FROM}
app.mail.frontend-url=http://localhost:3000
app.mail.reset-path=/reset-password
app.mail.token-validity-minutes=15
