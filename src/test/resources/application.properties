spring.datasource.url=jdbc:h2:mem:cinetime;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
debug=false
logging.level.org.hibernate.SQL=OFF
spring.flyway.enabled=false

spring.data.redis.repositories.enabled=false
spring.redis.host=localhost
spring.redis.port=6379
spring.redis.password=
spring.redis.ssl=false

logging.file.name=
app.admin.email=admin@test.local
app.admin.password=TestPassword123!
app.mail.from=no-reply@test.local
app.reset.token.expiration.time=15

spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

jwt.secret=test-secret-key-test-secret-key-test-secret-key
cinetime.app.accessTokenExpirationMs=900000
cinetime.app.refreshTokenExpirationMs=604800000
ticket.qr.secret=test-ticket-qr-secret-test-ticket-qr-secret
app.booking.cancellation-cutoff-minutes=120
